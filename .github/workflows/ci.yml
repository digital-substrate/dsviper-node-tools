name: CI

on:
  push:
    branches: [ main, 'LTS-*' ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [ 22, 24 ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No runtime deps of its own; install the peer binding for the CLI smoke tests.
      # The floor is the binding stub fixes the tools rely on; the upper bound keeps the
      # 1.2 line off a future 2.0 binding. The pure endpoint test runs regardless.
      - name: Install peer binding
        run: npm install --no-save "@digitalsubstrate/dsviper@>=1.2.8 <2"

      - name: Test
        run: npm test
